<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Details</title>
</head>

<body>

    <h1>Customer Details</h1>

    <form id="customerForm">

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName">

        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName">

        <br><br>

        <label for="idNumber">ID Number:</label>
        <input type="text" id="idNumber">

        <br><br>

        <label for="email">Email:</label>
        <input type="text" id="email">

        <br><br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone">

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age">

        <br><br>

        <button type="submit">Generate Quote</button>
        <button id="continueButton" onclick="...">Continue</button>

    </form>

    <p id="errorMessage"></p>

    <script>
        document.getElementById("customerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;
            const idNumber = document.getElementById("idNumber").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const age = document.getElementById("age").value;
            const errorMessage = document.getElementById("errorMessage");

          if (!firstName || !lastName || !idNumber || !email || !phone || !age) {
                 errorMessage.textContent = "Please complete all required fields.";
            return;
}

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                errorMessage.textContent = "Please enter a valid email address.";
            return;
}

if (Number(age) < 18) {
    errorMessage.textContent = "Customer must be 18 years or older.";
    return;
}  

            sessionStorage.setItem("firstName", firstName);
            sessionStorage.setItem("lastName", lastName);
            sessionStorage.setItem("idNumber", idNumber);
            sessionStorage.setItem("email", email);
            sessionStorage.setItem("phone", phone);
            sessionStorage.setItem("age", age);

            window.location.href = "result.html";
        });
    </script>

</body>
</html>
